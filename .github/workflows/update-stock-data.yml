name: Update stock data

on:
  schedule:
    # 09:00 UTC = 17:00 HKT, after the HK market closes on trading days
    - cron: '0 9 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch latest stock data
        run: node scripts/fetch-stock-data.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock-data.json
          git diff --staged --quiet || git commit -m "Update stock price data"
          git push
